<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<!-- Blocks any outgoing connection: this page cannot send data to any server -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'">
<meta name="theme-color" content="#990000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>My Library</title>
<style>
  /* Fonts, sizes and colours follow AO3's own stylesheet */
  :root { --red:#900; --ink:#2a2a2a; --muted:#777; --line:#ddd; --fs:16px; --ls:13px;
          --sans:"Lucida Grande","Lucida Sans Unicode","GNU Unifont",Verdana,Helvetica,sans-serif; --serif:Georgia,serif; }
  * { box-sizing: border-box; }
  body { margin:0; background:#fff; color:var(--ink); font: 15px/1.5 var(--sans); }
  a { color:var(--red); }
  button, select, input { font:inherit; color:#444; }
  button, select, .btn { background: linear-gradient(#fff 2%, #ddd 95%, #bbb 100%); border:1px solid #bbb; border-bottom-color:#aaa;
           border-radius:.25em; padding:.3em .75em; cursor:pointer; text-decoration:none; display:inline-block; color:#444; }
  input[type=search] { padding:6px; border:1px solid #bbb; border-radius:.25em; }
  .muted { color:var(--muted); font-size:.9rem; }
  .center { text-align:center; padding:40px 10px; }
  .center button { display:block; margin:12px auto; min-width:220px; }

  header { display:none; position:sticky; top:0; z-index:5; background:var(--red); color:#fff; padding:8px 12px 0; flex-wrap:wrap; align-items:center; }
  body.open header { display:flex; }
  header .brand { color:#fff; font:bold 1.05rem var(--serif); text-decoration:none; flex:1; }
  header .icon { background:none; border:0; color:#fff; font-size:1.25rem; padding:0 8px; }
  header { transition: transform .25s; }
  body.hide-bar header { transform: translateY(-100%); }   /* bar slides away while scrolling down a chapter */
  body.full header { display:none !important; }            /* full screen: no bar at all */
  .tabs { flex-basis:100%; display:flex; margin-top:6px; }
  .tabs button { flex:1; background:none; border:0; border-radius:0; color:#ffffffb0; padding:8px 0; border-bottom:3px solid transparent; }
  .tabs button.on { color:#fff; font-weight:bold; border-bottom-color:#fff; }
  main { max-width:900px; margin:0 auto; padding:12px; }

  #out, .toolbar, .picks { font-size:var(--ls); }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
  .picks { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
  .picks select { width:100%; min-width:0; }
  h2.heading { font:normal 1.3em var(--serif); margin:6px 0 12px; }
  .tag { color:var(--ink); border-bottom:1px dotted; }

  /* AO3 work blurb (list) */
  ol.works { list-style:none; padding:0; margin:0; }
  .blurb { border:1px solid var(--line); box-shadow:1px 1px 3px #0001; padding:12px 14px; margin-bottom:14px; overflow:hidden; }
  .blurb .hd { display:flex; gap:10px; align-items:flex-start; }
  .req { display:grid; grid-template-columns:repeat(2, 2.2em); gap:3px; flex:none; }
  .sq { aspect-ratio:1; display:grid; place-items:center; color:#fff; font:bold 1.45em/1 var(--serif); border:1px solid #0002; }
  .ttl { flex:1; min-width:0; }
  .ttl h4 { margin:0; font:normal 1.2em var(--serif); }
  .ttl h5 { margin:4px 0 0; font:normal 1em var(--serif); }
  .date { flex:none; margin:0; font:.8em monospace; color:var(--muted); }
  ul.tags { list-style:none; padding:0; margin:10px 0 0; line-height:1.75; }
  ul.tags li { display:inline; }
  ul.tags li:not(:last-child)::after { content:", "; }
  ul.tags .warnings .tag { font-weight:bold; border:0; }
  blockquote.summary { margin:10px 0 0; }
  dl.stats { text-align:right; margin:10px 0 0; font-size:.9em; }
  dl.stats dt, dl.stats dd { display:inline; margin:0; }
  dl.stats dd { margin-inline-end:12px; }

  /* AO3-style Sort and Filter panel */
  .filters { background:#ddd; border-radius:4px; padding:8px 12px; margin-bottom:12px; font-size:var(--ls); }
  .filters h3 { font:bold 1.15em var(--serif); margin:.6em 0 .2em; }
  .filters summary { padding:5px 0; border-bottom:1px dotted #999; cursor:pointer; }
  .filters label { display:block; padding:4px 0 4px 4px; }
  .filters input { margin:0 6px 0 0; vertical-align:-2px; }
  #out .tag { cursor:pointer; }
  .blurb .series { margin:8px 0 0; }
  .blurb .new { margin:8px 0 0; color:var(--red); font-weight:bold; }
  .upnext { text-align:center; margin:2em 0 0; }
  .upnext .btn { margin:4px 0; }
  ul.groups { list-style:none; padding:0; margin:0; font-size:var(--ls); }
  ul.groups li { display:flex; justify-content:space-between; align-items:baseline; border:1px solid var(--line); box-shadow:1px 1px 3px #0001; padding:12px 14px; margin-bottom:10px; }
  ul.groups a { font:1.25em var(--serif); }
  .gctl { display:flex; gap:6px; align-items:center; margin-top:10px; padding-top:8px; border-top:1px dotted #bbb; }
  .gctl span { flex:1; }
  .upnext select { max-width:70vw; margin-top:8px; font-size:.85rem; }

  /* Bookshelf */
  .shelf { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .book img { display:block; width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:3px; box-shadow:0 1px 4px #0004; background:#eee; }

  /* AO3 chapter page */
  ul.actions { list-style:none; padding:0; margin:6px 0 10px; display:flex; flex-wrap:wrap; justify-content:center; gap:8px; }
  ul.actions select { max-width:46vw; }
  ul.tools { gap:4px; margin-top:-2px; }
  ul.tools button, ul.tools .btn, ul.tools select { font-size:.78rem; padding:.15em .6em; }
  .wrapper { border:1px solid var(--line); box-shadow:1px 1px 5px #aaa; padding:.6em 1em; margin:.6em 0 1.5em; }
  dl.meta { margin:0; }
  dl.meta dt { margin-top:.6em; }
  dl.meta dt.warning, dl.meta dd.warning .tag { font-weight:bold; }
  dl.meta dd { margin:0 0 0 1.5em; }
  dl.meta .st { margin-right:1.2em; white-space:nowrap; display:inline-block; }
  .work { font-size:var(--fs); }
  .preface { text-align:center; margin:2em 0 0; }
  .preface h2.title { font:normal 2.25em/1.1 var(--serif); margin:0 0 .5em; }
  .preface h3.byline { font:normal 1.3em var(--serif); margin:0 0 1em; }
  .preface .cover-big { display:block; max-width:200px; margin:0 auto 1.2em; box-shadow:3px 3px 8px #0005; border-radius:3px; }
  hr.line { border:0; border-top:1px solid #333; width:75%; margin:0 auto 1.5em; }
  .module { margin:0 auto 1.5em; width:80%; text-align:left; }
  h3.heading { font:normal 1.45em var(--serif); border-bottom:1px solid #333; margin:.6em 0 .4em; }
  .module blockquote { margin:0 0 0 1.2em; }
  .chapter h3.title { text-align:center; font:normal 1.45em var(--serif); margin:.4em 0 1em; }
  .chapter h3.title span { border-bottom:1px solid #333; }
  .userstuff { line-height:1.5; margin:2em 0; }
  .userstuff p { margin:1.286em auto; }
  .work p, .work li, .work blockquote { unicode-bidi: plaintext; text-align: start; }

  dialog { border:0; border-radius:10px; padding:20px; width:min(92vw, 360px); }
  dialog::backdrop { background:var(--red); }
  dialog input { width:100%; font-size:1.1rem; padding:8px; margin:8px 0; }
  dialog menu { display:flex; gap:8px; padding:0; margin:8px 0 0; }
  #dlg-err { color:#d33; min-height:1em; margin:0; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 18px; border-radius:20px; z-index:9; }

  /* Reading position: thin light-gray marker on the right edge, never catches taps */
  #pos { position:fixed; right:2px; top:0; width:3px; border-radius:2px; background:#d0d0d0; pointer-events:none; z-index:4; display:none; }

</style>
</head>
<body>
<header>
  <a class="brand" href="#">My Library</a>
  <button class="icon" data-do="go" data-arg="settings" aria-label="Settings">⚙</button>
  <button class="icon" data-do="lock" aria-label="Lock">🔒</button>
  <nav class="tabs">
    <button data-do="go" data-arg="" data-tab="">Works</button>
    <button data-do="go" data-arg="shelf" data-tab="shelf">Bookshelf</button>
    <button data-do="go" data-arg="groups" data-tab="groups">Collections</button>
  </nav>
</header>
<main id="main"></main>
<input type="file" id="pick" hidden>
<div id="toast" hidden></div>
<div id="pos"></div>
<dialog id="dlg">
  <form method="dialog">
    <p id="dlg-msg"></p>
    <input id="dlg-pw" type="password" autocomplete="current-password">
    <p id="dlg-err"></p>
    <menu><button value="ok">OK</button><button value="" id="dlg-cancel">Cancel</button></menu>
  </form>
</dialog>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const main = $('#main'), enc = new TextEncoder(), dec = new TextDecoder();
let key = null, index = [], groups = [], cache = {}, covers = {}, hiddenAt = 0;

/* ---------- Local storage (IndexedDB) ---------- */
const dbp = new Promise((ok, no) => {
  const r = indexedDB.open('my-library', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
});
async function store(mode, fn) {
  const t = (await dbp).transaction('kv', mode), req = fn(t.objectStore('kv'));
  return new Promise((ok, no) => { t.oncomplete = () => ok(req.result); t.onerror = () => no(t.error); });
}
const get = k => store('readonly', s => s.get(k));
const put = (k, v) => store('readwrite', s => s.put(v, k));
const del = k => store('readwrite', s => s.delete(k));
async function entries() {
  const [keys, vals] = await Promise.all([store('readonly', s => s.getAllKeys()), store('readonly', s => s.getAll())]);
  return Object.fromEntries(keys.map((k, i) => [k, vals[i]]));
}

/* ---------- Encryption: AES-GCM, key derived from the password ---------- */
async function deriveKey(pw, salt) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function seal(k, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, enc.encode(JSON.stringify(obj))));
  const out = new Uint8Array(12 + data.length); out.set(iv); out.set(data, 12); return out;
}
async function unseal(k, u) {
  return JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, k, u.slice(12))));
}
const saveIndex = async () => put('index', await seal(key, index));
const saveGroups = async () => put('groups', await seal(key, groups));   // collections, encrypted like everything else
const groupById = id => groups.find(g => g.id === id);
const getCover = async id => covers[id] ??= await unseal(key, await get('c:' + id));

/* ---------- Small helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const txt = el => el ? el.textContent.replace(/\s+/g, ' ').trim() : '';
const b64 = u => { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const chName = (c, i) => c.title || 'Chapter ' + (i + 1);
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) : '';
const pref = (k, v) => { try { return v === undefined ? localStorage[k] : (localStorage[k] = v); } catch {} };
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3500); }

function askPassword(msg, cancelable = true, err = '') {
  const d = $('#dlg');
  $('#dlg-msg').textContent = msg; $('#dlg-err').textContent = err;
  $('#dlg-pw').value = ''; $('#dlg-cancel').hidden = !cancelable; d.returnValue = '';
  d.oncancel = e => cancelable || e.preventDefault();
  d.showModal();
  return new Promise(ok => d.onclose = () => ok(d.returnValue === 'ok' ? $('#dlg-pw').value : null));
}
function pickFiles(accept, multiple = false) {
  const p = $('#pick'); Object.assign(p, { accept, multiple, value: '' });
  return new Promise(ok => { p.onchange = () => ok([...p.files]); p.click(); });
}
function readBackup(text) {
  try {
    const o = JSON.parse(text);
    return o.app === 'my-library' ? Object.fromEntries(Object.entries(o.data).map(([k, v]) => [k, unb64(v)])) : null;
  } catch { return null; }
}

/* ---------- Parsing an AO3 HTML download ---------- */
function parseWork(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,style,link,iframe,object,embed,form,meta,p.message').forEach(n => n.remove());
  doc.querySelectorAll('*').forEach(el => [...el.attributes].forEach(a => {
    if (/^on/i.test(a.name) || /^\s*javascript:/i.test(a.value)) el.removeAttribute(a.name);
  }));
  const pre = doc.querySelector('#preface') || doc.createElement('div');
  const after = doc.querySelector('#afterword');
  const block = label => [...pre.querySelectorAll('p')].find(p => txt(p) === label)?.nextElementSibling?.innerHTML.trim() || '';
  const tags = [...pre.querySelectorAll('dl.tags dt')].map(dt =>
    [txt(dt).replace(/:$/, ''), txt(dt.nextElementSibling).split(/,\s+/).filter(Boolean)]);
  const stats = tags.find(([l]) => /^stats/i.test(l))?.[1].join(' ') || '';
  const chapters = splitChapters(doc.querySelector('#chapters') || doc.body);
  return {
    meta: {
      title: txt(pre.querySelector('h1')) || txt(doc.querySelector('title')) || 'Untitled',
      author: txt(pre.querySelector('.byline')).replace(/^by\s+/i, ''),
      tags, summary: block('Summary'),
      words: stats.match(/Words:\s*([\d,]+)/)?.[1] || '?',
      chapters: stats.match(/Chapters:\s*(\S+)/)?.[1] || chapters.length,
      date: [...stats.matchAll(/(\d{4}-\d\d-\d\d)/g)].pop()?.[1] || '',
      last: null,
    },
    work: { notes: block('Notes'), after: txt(after) ? after.innerHTML.trim() : '', chapters },
  };
}
function splitChapters(box) {
  const out = []; let cur;
  for (const el of box.children) {
    const head = el.matches('div.meta') && el.querySelector('h2.heading');
    if (head) { head.remove(); out.push(cur = { title: txt(head), notes: el.innerHTML.trim(), body: '', end: '' }); }
    else if (cur) cur[el.matches('.meta, .endnotes') ? 'end' : 'body'] += el.outerHTML;
  }
  return out.length ? out : [{ title: '', notes: '', body: box.innerHTML, end: '' }];
}

/* ---------- Unlock and lock ---------- */
async function start() {
  key = null; index = []; groups = []; cache = {}; covers = {}; main.innerHTML = '';
  document.body.classList.remove('open');
  const salt = await get('salt');
  if (!salt) return showWelcome();
  for (let err = ''; !key;) {
    const pw = await askPassword('Enter your password to open the library', false, err);
    try {
      const k = await deriveKey(pw || '', salt), g = await get('groups');
      index = await unseal(k, await get('index')); groups = g ? await unseal(k, g) : []; key = k;
    }
    catch { err = 'Wrong password, try again'; }
  }
  enter();
}
function enter() {
  document.body.classList.add('open');
  navigator.storage?.persist?.();   // asks the phone not to clear this data when space runs low
  // Reopen where you left off: same screen, same spot in the chapter
  const p = place();
  restoreY = p.y;
  if ((p.h || '') !== location.hash) location.hash = p.h || ''; else route();
  importShared();
}

/* Last screen and scroll position. Only a random work id and a number are kept, nothing readable. */
let restoreY = null;
const place = () => { try { return JSON.parse(pref('place')) || {}; } catch { return {}; } };
const savePlace = () => key && pref('place', JSON.stringify({ h: location.hash, y: scrollY / document.documentElement.scrollHeight }));

/* Adds new works, or updates ones already in the library (same title and author, or the work given by id).
   Reading place, cover and series link are kept; new chapters are counted. */
async function importTexts(texts, id) {
  const notes = [];
  for (const html of texts) {
    const { meta, work } = parseWork(html);
    const old = id ? index.find(m => m.id === id) : index.find(m => m.title === meta.title && m.author === meta.author);
    const before = old ? old.count ?? parseInt(old.chapters) : 0, added = old ? work.chapters.length - before : 0;
    Object.assign(meta, { id: old?.id || crypto.randomUUID(), last: old?.last ?? null, readAt: old?.readAt, cover: old?.cover,
      next: old?.next, added: old?.added || Date.now(), count: work.chapters.length,
      newFrom: added > 0 ? before : old?.newFrom });   // first new chapter, for the "new chapters" mark
    await put('w:' + meta.id, await seal(key, work));
    index = [meta, ...index.filter(m => m !== old)];
    if (cache.id === meta.id) cache = {};
    notes.push(!old ? `Added: ${meta.title}` : added > 0 ? `${meta.title}: ${added} new chapter${added > 1 ? 's' : ''}` : `${meta.title}: no new chapters`);
  }
  await saveIndex();
  toast(notes.length > 2 ? `${notes.length} works added or updated` : notes.join(' · '));
  id ? route() : location.hash === '' ? route() : location.hash = '';
}

/* Files shared into the app from another app (e.g. Downloads → Share → My Library) wait in a
   temporary cache until the library is unlocked, then are imported and deleted from there. */
async function importShared() {
  const c = await caches.open('shared'), reqs = await c.keys();
  if (!reqs.length) return;
  const texts = await Promise.all(reqs.map(r => c.match(r).then(x => x.text())));
  await Promise.all(reqs.map(r => c.delete(r)));
  importTexts(texts);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); savePlace(); }
  else if (key && Date.now() - hiddenAt > 5 * 60e3) start();   // auto-lock after 5 minutes in the background
});

/* ---------- Actions ---------- */
const actions = {
  go: v => location.hash = v,
  lock: start,
  top: () => scrollTo(0, 0),
  full: () => document.fullscreenElement ? document.exitFullscreen()
    : document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => toast('Full screen is not available here')),
  size(arg) { const [k, d] = arg.split(','); pref(k, Math.min(28, Math.max(10, size(k) + +d))); applySizes(); if (location.hash === '#settings') route(); },
  async create() {
    const pw = await askPassword('Choose a password (at least 4 characters). If you forget it, the library cannot be recovered.');
    if (!pw) return;
    if (pw.length < 4) return toast('Password is too short');
    if (await askPassword('Type the password again to confirm') !== pw) return toast("Passwords don't match");
    const salt = crypto.getRandomValues(new Uint8Array(16));
    key = await deriveKey(pw, salt); index = [];
    await put('salt', salt); await saveIndex(); enter();
  },
  async restore() {
    const [f] = await pickFiles('.json,application/json');
    const data = f && readBackup(await f.text());
    if (!data) return f && toast('This is not a library backup file');
    for (const k in data) await put(k, data[k]);
    start();
  },
  async add(id) {
    const files = await pickFiles('.html,.htm,text/html', !id);
    if (files.length) importTexts(await Promise.all(files.map(f => f.text())), id);
  },
  async cover(id) {
    const [f] = await pickFiles('image/*');
    if (!f) return;
    const img = await createImageBitmap(f), s = Math.min(1, 480 / img.width);
    const cv = Object.assign(document.createElement('canvas'), { width: img.width * s | 0, height: img.height * s | 0 });
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    covers[id] = cv.toDataURL('image/jpeg', 0.85);
    await put('c:' + id, await seal(key, covers[id]));
    index.find(m => m.id === id).cover = true; await saveIndex(); route();
  },
  async uncover(id) {
    await del('c:' + id); delete covers[id];
    index.find(m => m.id === id).cover = false; await saveIndex(); route();
  },
  async backup() {
    toast('Preparing backup…');
    const data = Object.fromEntries(Object.entries(await entries()).map(([k, v]) => [k, b64(v)]));
    const file = new File([JSON.stringify({ app: 'my-library', v: 1, data })],
      `library-backup-${new Date().toISOString().slice(0, 10)}.json`, { type: 'application/json' });
    // Saved straight to Downloads: the phone's share sheet refused this file type and failed silently
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(file), download: file.name });
    document.body.append(a); a.click(); a.remove();
    toast(`Backup saved to Downloads: ${file.name}`);
  },
  async merge() {
    const [f] = await pickFiles('.json,application/json');
    const data = f && readBackup(await f.text());
    if (!data) return f && toast('This is not a library backup file');
    const pw = await askPassword("Enter the backup file's password");
    if (!pw) return;
    let bk, list;
    try { bk = await deriveKey(pw, data.salt); list = await unseal(bk, data.index); }
    catch { return toast('Wrong password for this file'); }
    const added = list.filter(m => !index.some(x => x.id === m.id));
    for (const m of added) for (const k of ['w:' + m.id, 'c:' + m.id])
      if (data[k]) await put(k, await seal(key, await unseal(bk, data[k])));
    index.push(...added); await saveIndex();
    const bg = data.groups ? await unseal(bk, data.groups) : [];
    groups.push(...bg.filter(g => !groupById(g.id))); await saveGroups();
    toast(`${added.length} works added from the backup`); route();
  },
  async remove(id) {
    if (!confirm('Delete this work from your library?')) return;
    await Promise.all([del('w:' + id), del('c:' + id)]);
    index = index.filter(m => m.id !== id); await saveIndex();
    groups.forEach(g => g.ids = g.ids.filter(x => x !== id)); await saveGroups();
    location.hash = '';
  },
  async newGroup() { if (await makeGroup()) route(); },
  async renameGroup(id) {
    const g = groupById(id), name = prompt('New name for this collection', g.name);
    if (name?.trim()) { g.name = name.trim(); await saveGroups(); route(); }
  },
  async deleteGroup(id) {
    if (!confirm('Delete this collection? The works stay in your library.')) return;
    groups = groups.filter(g => g.id !== id); await saveGroups();
    location.hash = 'groups';
  },
  async moveInGroup(arg) {
    const [gid, wid, d] = arg.split(','), ids = groupById(gid).ids, i = ids.indexOf(wid), j = i + +d;
    if (j < 0 || j >= ids.length) return;
    [ids[i], ids[j]] = [ids[j], ids[i]]; await saveGroups(); route();
  },
  async leaveGroup(arg) {
    const [gid, wid] = arg.split(','), g = groupById(gid);
    g.ids = g.ids.filter(x => x !== wid); await saveGroups(); route();
  },
};
async function makeGroup() {
  const name = prompt('Name for the new collection');
  if (!name?.trim()) return null;
  const g = { id: crypto.randomUUID(), name: name.trim(), ids: [] };
  groups.push(g); await saveGroups();
  return g;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-do]');
  if (b) actions[b.dataset.do](b.dataset.arg);
});
const reading = () => location.hash.startsWith('#w/');
main.addEventListener('dblclick', e => {   // double tap on the text toggles full screen
  if (reading() && !e.target.closest('a, button, select')) { getSelection().removeAllRanges(); actions.full(); }
});
document.addEventListener('fullscreenchange', () => document.body.classList.toggle('full', !!document.fullscreenElement));
main.addEventListener('change', e => {
  if (e.target.matches('.chsel')) location.hash = e.target.value;
  if (e.target.matches('.grpsel')) (async () => {
    const wid = e.target.dataset.id, g = e.target.value === 'new' ? await makeGroup() : groupById(e.target.value);
    if (g) {
      const i = g.ids.indexOf(wid);
      i < 0 ? g.ids.push(wid) : g.ids.splice(i, 1);
      await saveGroups(); toast(`${i < 0 ? 'Added to' : 'Removed from'} ${g.name}`);
    }
    route();
  })();
  if (e.target.matches('.nextsel')) { index.find(m => m.id === e.target.dataset.id).next = e.target.value; saveIndex(); route(); }
});
const size = k => +pref(k) || { fs: 16, ls: 13 }[k];
const applySizes = () => ['fs', 'ls'].forEach(k => document.documentElement.style.setProperty('--' + k, size(k) + 'px'));

/* ---------- Screens ---------- */
function route() {
  if (!key) return;
  const [view, id, ch] = location.hash.slice(1).split('/');
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === (view === 'g' ? 'groups' : view)));
  scrollTo(0, 0);
  updatePos();
  document.body.classList.remove('hide-bar');
  $('meta[name=theme-color]').content = view === 'w' ? '#ffffff' : '#990000';
  if (view !== 'w' && document.fullscreenElement) document.exitFullscreen();
  const y = restoreY; restoreY = null;
  if (view === 'w') return showWork(id, ch).then(() => { if (y) scrollTo(0, y * document.documentElement.scrollHeight); updatePos(); savePlace(); });
  savePlace();
  if (view === 'shelf') return showShelf();
  if (view === 'groups') return showGroups();
  if (view === 'g') return showGroup(id);
  if (view === 'settings') return showSettings();
  showList();
}
addEventListener('hashchange', route);

function updatePos() {
  const pos = $('#pos'), total = document.documentElement.scrollHeight, max = total - innerHeight;
  pos.style.display = key && location.hash.startsWith('#w/') && max > 0 ? 'block' : 'none';
  const len = Math.max(24, innerHeight * innerHeight / total);
  Object.assign(pos.style, { height: len + 'px', top: scrollY / max * (innerHeight - len) + 'px' });
}
let lastY = 0;
addEventListener('scroll', () => {
  updatePos();
  if (Math.abs(scrollY - lastY) < 8) return;
  document.body.classList.toggle('hide-bar', reading() && scrollY > 60 && scrollY > lastY);
  lastY = scrollY;
  savePlace();
}, { passive: true });
addEventListener('resize', updatePos);

function showWelcome() {
  main.innerHTML = `<div class="center">
    <h2>My Library</h2>
    <p class="muted">Everything is stored encrypted on this phone only. Nothing is ever sent anywhere.</p>
    <button data-do="create">Create a new library</button>
    <button data-do="restore">Restore from a backup file</button></div>`;
}

/* AO3 "required tags" squares: rating, category, warnings, completion */
const tagsOf = (m, re) => m.tags.filter(([l]) => re.test(l)).flatMap(([, v]) => v);
const sq = (sym, bg, title) => `<span class="sq" style="background:${bg}" title="${esc(title)}">${sym}</span>`;
const RATINGS = [['general', 'G', '#77a170'], ['teen', 'T', '#e4c400'], ['mature', 'M', '#e9711c'], ['explicit', 'E', '#9c0000']];
const CATS = { 'f/f': ['♀', '#c21f4c'], 'f/m': ['⚥', '#7a2c8f'], 'm/m': ['♂', '#1f5fb5'], 'gen': ['○', '#77a170'], 'other': ['?', '#222'] };
function required(m) {
  const rating = tagsOf(m, /^rating/i).join(), warn = tagsOf(m, /^archive warning/i).join(), cats = tagsOf(m, /^categor/i);
  const [, r, rc] = RATINGS.find(([k]) => rating.toLowerCase().includes(k)) || [, '', '#fff'];
  const [c, cc] = cats.length > 1 ? ['', 'linear-gradient(135deg,#c21f4c,#e9711c,#e4c400,#77a170,#1f5fb5,#7a2c8f)']
                                  : CATS[(cats[0] || '').toLowerCase()] || ['', '#fff'];
  const done = /^(\d+)\/\1$/.test(m.chapters);
  return `<div class="req">
    ${sq(r, rc, rating || 'Not Rated')}${sq(c, cc, cats.join(', ') || 'No category')}
    ${/no archive warnings/i.test(warn) || !warn ? sq('', '#fff', warn || 'No warnings')
      : /chose not/i.test(warn) ? sq('!?', '#e9711c', warn) : sq('!', '#9c0000', warn)}
    ${sq(done ? '✓' : '⊘', done ? '#77a170' : '#9c0000', done ? 'Complete Work' : 'Work in Progress')}</div>`;
}
/* Series: AO3's "Part 2 of Name" is linked automatically; a manual choice (m.next) overrides it */
const seriesOf = m => tagsOf(m, /^series/i).map(s => s.match(/Part (\d+) of (.+)/i)).filter(Boolean).map(([, p, name]) => ({ part: +p, name }));
function nextOf(m) {
  if (m.next) return index.find(x => x.id === m.next);   // 'none' finds nothing
  for (const s of seriesOf(m)) {
    const n = index.find(x => seriesOf(x).some(t => t.name === s.name && t.part === s.part + 1));
    if (n) return n;
  }
}

function blurb(m, extra = '') {
  const tag = (gi, t) => `<span class="tag" data-k="${esc(gi + '|' + t)}">${esc(t)}</span>`;
  const group = (gi, cls) => GROUPS[gi][1](m).map(t => `<li class="${cls}">${tag(gi, t)}</li>`).join('');
  const lang = tagsOf(m, /^language/i).join(', ');
  return `<li class="blurb">
    <div class="hd">${required(m)}
      <div class="ttl"><h4><a href="#w/${m.id}/${m.last ?? 0}">${esc(m.title)}</a> by ${authorsOf(m).map(a => tag(7, a)).join(', ')}</h4>
        <h5>${GROUPS[3][1](m).map(t => tag(3, t)).join(', ')}</h5></div>
      <p class="date">${fmtDate(m.date)}</p></div>
    <ul class="tags">${group(1, 'warnings')}${group(5, '')}${group(4, '')}${group(6, '')}</ul>
    ${m.summary ? `<blockquote class="summary">${m.summary}</blockquote>` : ''}
    ${seriesOf(m).map(s => `<p class="series">Part <b>${s.part}</b> of <b>${esc(s.name)}</b></p>`).join('')}
    ${groups.filter(g => g.ids.includes(m.id)).map(g => `<p class="series">Part <b>${g.ids.indexOf(m.id) + 1}</b> of <a href="#g/${g.id}"><b>${esc(g.name)}</b></a></p>`).join('')}
    ${m.newFrom != null && (m.last ?? -1) < m.newFrom ? `<p class="new">✦ ${m.count - m.newFrom} new chapter${m.count - m.newFrom > 1 ? 's' : ''}</p>` : ''}
    <dl class="stats">${lang ? `<dt>Language:</dt> <dd>${esc(lang)}</dd>` : ''}
      <dt>Words:</dt> <dd>${esc(m.words)}</dd> <dt>Chapters:</dt> <dd>${esc(m.chapters)}</dd>
      <dt>Read:</dt> <dd>${m.last == null ? 'Not yet' : 'Ch. ' + (m.last + 1)}</dd></dl>${extra}
  </li>`;
}

const SORTS = {
  updated: ['Date Updated', m => m.date || ''], added: ['Date Added', m => m.added], read: ['Recently Read', m => m.readAt || 0],
  title: ['Title', m => m.title.toLowerCase(), 1], author: ['Author', m => m.author.toLowerCase(), 1],
  words: ['Word Count', m => +String(m.words).replace(/\D/g, '') || 0],
};
const authorsOf = m => m.author.split(/,\s+|\s+and\s+/).filter(Boolean);
const GROUPS = [['Ratings', /^rating/i], ['Warnings', /^archive warning/i], ['Categories', /^categor/i], ['Fandoms', /^fandom/i],
  ['Characters', /^character/i], ['Relationships', /^relationship/i], ['Additional Tags', /^additional/i]]
  .map(([g, re]) => [g, m => tagsOf(m, re)]).concat([['Authors', authorsOf], ['Collections', m => groups.filter(g => g.ids.includes(m.id)).map(g => g.name)]]);
const filters = { inc: new Set(), exc: new Set() }, openG = new Set();   // kept in memory only, never saved unencrypted
let panelOpen = false;
const hasTag = (m, k) => { const i = k.indexOf('|'); return GROUPS[k.slice(0, i)][1](m).includes(k.slice(i + 1)); };

const countsOf = get => {   // [tag, number of works], most common first
  const c = {};
  index.forEach(m => new Set(get(m)).forEach(t => c[t] = (c[t] || 0) + 1));
  return Object.entries(c).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
};

/* Quick pick lists above the results: title, fandom, author, tag (they share state with the Filters panel) */
const PICKS = [['fandoms', [3]], ['authors', [7]], ['tags', [5, 4, 6]], ['collections', [8]]];
let titleId = '';
function picks() {
  const opt = (v, label, sel) => `<option value="${esc(v)}" ${sel ? 'selected' : ''}>${esc(label)}</option>`;
  return `<select data-pick="title">${opt('', 'All titles')}${[...index].sort((a, b) => a.title.localeCompare(b.title))
      .map(m => opt(m.id, m.title, m.id === titleId)).join('')}</select>` +
    PICKS.map(([l, gs], pi) => `<select data-pick="${pi}">${opt('', 'All ' + l)}${gs.map(gi => `<optgroup label="${GROUPS[gi][0]}">${
      countsOf(GROUPS[gi][1]).map(([t, n]) => opt(gi + '|' + t, `${t} (${n})`, filters.inc.has(gi + '|' + t))).join('')}</optgroup>`).join('')}</select>`).join('');
}

function filterPanel() {
  return '<button id="fclear">Clear Filters</button>' + [['inc', 'Include'], ['exc', 'Exclude']].map(([mode, title]) => `<h3>${title}</h3>` +
    GROUPS.map(([g, get], gi) => {
      const list = countsOf(get);
      return list.length ? `<details data-g="${mode + gi}" ${openG.has(mode + gi) ? 'open' : ''}><summary>${g}</summary>${list.map(([t, n]) =>
        `<label><input type="checkbox" data-f="${mode}" value="${esc(gi + '|' + t)}" ${filters[mode].has(gi + '|' + t) ? 'checked' : ''}>${esc(t)} (${n})</label>`).join('')}</details>` : '';
    }).join('')).join('');
}

function filtered() {
  const [, val, asc] = SORTS[pref('sort')] || SORTS.updated;
  return index.filter(m => (!titleId || m.id === titleId)
      && [...filters.inc].every(k => hasTag(m, k)) && ![...filters.exc].some(k => hasTag(m, k)))
    .sort((a, b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * (asc ? 1 : -1));
}
function toolbar(draw) {
  main.innerHTML = `<div class="toolbar"><button data-do="add">+ Add Work</button>
    <select id="sort">${Object.entries(SORTS).map(([k, [l]]) => `<option value="${k}" ${k === (pref('sort') || 'updated') ? 'selected' : ''}>Sort by ${l}</option>`).join('')}</select>
    <button id="fbtn"></button></div>
    <div id="picks" class="picks"></div>
    <div id="filters" class="filters" ${panelOpen ? '' : 'hidden'}></div><div id="out"></div>`;
  const panel = $('#filters');
  const redraw = (rebuild) => {
    const n = filters.inc.size + filters.exc.size + !!titleId;
    $('#fbtn').textContent = 'Filters' + (n ? ` (${n})` : '');
    if (rebuild) { panel.innerHTML = filterPanel(); $('#picks').innerHTML = picks(); }
    draw();
  };
  $('#picks').onchange = e => {
    const p = e.target.dataset.pick, v = e.target.value;
    if (p === 'title') titleId = v;
    else {
      PICKS[p][1].forEach(gi => [...filters.inc].forEach(k => k.startsWith(gi + '|') && filters.inc.delete(k)));
      if (v) { filters.inc.add(v); filters.exc.delete(v); }
    }
    redraw(true);
  };
  $('#sort').onchange = () => { pref('sort', $('#sort').value); draw(); };
  $('#fbtn').onclick = () => { panel.hidden = !(panelOpen = !panelOpen); };
  panel.addEventListener('toggle', e => openG[e.target.open ? 'add' : 'delete'](e.target.dataset.g), true);
  panel.onclick = e => { if (e.target.id === 'fclear') { filters.inc.clear(); filters.exc.clear(); titleId = ''; redraw(true); } };
  panel.onchange = e => {
    const { f } = e.target.dataset, k = e.target.value, other = f === 'inc' ? 'exc' : 'inc';
    if (!e.target.checked) return filters[f].delete(k), redraw();
    filters[f].add(k); filters[other].delete(k);
    if (f === 'inc' && k.startsWith('0|')) [...filters.inc].forEach(x => x !== k && x.startsWith('0|') && filters.inc.delete(x));  // one rating at a time, like AO3
    redraw(true);
  };
  $('#out').onclick = e => { const { k } = e.target.dataset; if (k) { filters.inc.add(k); filters.exc.delete(k); redraw(true); } };
  redraw(true);
}

function showList() {
  document.title = 'My Library';
  toolbar(() => {
    const list = filtered();
    $('#out').innerHTML = `<h2 class="heading">${list.length} Work${list.length === 1 ? '' : 's'} in My Library</h2>
      <ol class="works">${list.map(blurb).join('')}</ol>` +
      (index.length ? '' : '<p class="center muted">Your library is empty. Tap "+ Add" and choose an HTML file downloaded from AO3.</p>');
  });
}

function showShelf() {
  document.title = 'Bookshelf';
  toolbar(async () => {
    const list = filtered().filter(m => m.cover);
    $('#out').innerHTML = list.length
      ? `<div class="shelf">${list.map(m => `<a class="book" href="#w/${m.id}/${m.last ?? 0}"><img data-id="${m.id}" alt="${esc(m.title)}"></a>`).join('')}</div>`
      : '<p class="center muted">No covers yet. Open a work and tap "Cover" to add one.</p>';
    for (const img of main.querySelectorAll('img[data-id]')) img.src = await getCover(img.dataset.id);
  });
}

/* AO3 download labels ("Chapter Notes", "End Notes"...) become AO3-style "Notes:" headings */
const labels = html => html.replace(/<p>\s*(?:Chapter\s+)?(Summary|Notes|End Notes)\s*<\/p>/gi,
  (_, t) => `<h3 class="heading">${/notes/i.test(t) ? 'Notes' : 'Summary'}:</h3>`);
const module = html => html ? `<div class="module">${labels(html)}</div>` : '';

async function showWork(id, ch) {
  const m = index.find(x => x.id === id);
  if (!m) return location.hash = '';
  if (cache.id !== id) cache = { id, w: await unseal(key, await get('w:' + id)) };
  const w = cache.w, n = w.chapters.length, i = Math.min(+ch || 0, n - 1), c = w.chapters[i];
  m.last = i; m.readAt = Date.now(); saveIndex();
  document.title = m.title + (n === 1 ? '' : ' - ' + chName(c, i));
  const btn = (j, label) => `<li><a class="btn" href="#w/${id}/${j}">${label}</a></li>`;
  const nav = (i > 0 ? btn(i - 1, '← Previous') : '') + (i < n - 1 ? btn(i + 1, 'Next →') : '');
  const dd = (l, v) => /^stats/i.test(l)
    ? v.join(' ').replace(/(\S+:)\s*(\S+)/g, (_, a, b) => `<span class="st">${esc(a)} ${esc(b)}</span>`)
    : v.map(t => `<span class="tag">${esc(t)}</span>`).join(', ');
  const warn = l => /warning/i.test(l) ? 'warning' : '';

  main.innerHTML = `
    <ul class="actions">
      ${i > 0 ? btn(i - 1, '← Previous') : ''}
      ${n > 1 ? `<li><select class="chsel">${w.chapters.map((x, j) => `<option value="w/${id}/${j}" ${j === i ? 'selected' : ''}>${esc(j + 1 + '. ' + chName(x, j))}</option>`).join('')}</select></li>` : ''}
      ${i < n - 1 ? btn(i + 1, 'Next →') : ''}
    </ul>
    <ul class="actions tools">
      <li><button data-do="full">⛶ Full Screen</button></li>
      <li><button data-do="size" data-arg="fs,-1">A−</button></li><li><button data-do="size" data-arg="fs,1">A+</button></li>
      <li><button data-do="cover" data-arg="${id}">${m.cover ? 'Change Cover' : 'Add Cover'}</button></li>
      ${m.cover ? `<li><button data-do="uncover" data-arg="${id}">Remove Cover</button></li>` : ''}
      <li><select class="grpsel" data-id="${id}"><option value="">Collections…</option>${groups.map(g =>
        `<option value="${g.id}">${g.ids.includes(id) ? '✓ ' : ''}${esc(g.name)}</option>`).join('')}<option value="new">+ New collection</option></select></li>
      <li><button data-do="add" data-arg="${id}">Update</button></li>
      <li><button data-do="remove" data-arg="${id}">Delete</button></li>
    </ul>
    <div class="wrapper"><dl class="meta">${m.tags.map(([l, v]) =>
      `<dt class="${warn(l)}">${esc(l)}:</dt><dd class="${warn(l)}">${dd(l, v)}</dd>`).join('')}</dl></div>
    <div class="work">
      <div class="preface">
        ${m.cover && i === 0 ? `<img class="cover-big" src="${await getCover(id)}" alt="">` : ''}
        <h2 class="title">${esc(m.title)}</h2><h3 class="byline">${esc(m.author)}</h3><hr class="line">
        ${i === 0 ? module((m.summary ? `<p>Summary</p><blockquote>${m.summary}</blockquote>` : '') + (w.notes ? `<p>Notes</p><blockquote>${w.notes}</blockquote>` : '')) : ''}
      </div>
      <section class="chapter">
        ${n > 1 ? `<h3 class="title"><span>${esc(chName(c, i))}</span></h3>` : ''}
        ${module(c.notes)}
        <div class="userstuff">${c.body}</div>
        ${module(c.end)}
      </section>
      ${i === n - 1 ? module(w.after) + upNext(m) : ''}
    </div>
    <ul class="actions">${nav}<li><button data-do="top">↑ Top</button></li></ul>`;
}

function showGroups() {
  document.title = 'Collections';
  main.innerHTML = `<div class="toolbar"><button data-do="newGroup">+ New Collection</button></div>
    <h2 class="heading">${groups.length} Collection${groups.length === 1 ? '' : 's'}</h2>
    <ul class="groups">${groups.map(g => `<li><a href="#g/${g.id}">${esc(g.name)}</a>
      <span class="muted">${g.ids.length} work${g.ids.length === 1 ? '' : 's'}</span></li>`).join('')}</ul>
    ${groups.length ? '' : '<p class="center muted">No collections yet. Create one, then open a work and choose it in "Collections…".</p>'}`;
}

function showGroup(id) {
  const g = groupById(id);
  if (!g) return location.hash = 'groups';
  const works = g.ids.map(x => index.find(m => m.id === x)).filter(Boolean), first = works[0];
  document.title = g.name;
  main.innerHTML = `<p><a href="#groups">← Collections</a></p>
    <h2 class="heading">${esc(g.name)}</h2>
    <ul class="actions tools">
      ${first ? `<li><a class="btn" href="#w/${first.id}/${first.last ?? 0}">Read from the start</a></li>` : ''}
      <li><button data-do="renameGroup" data-arg="${id}">Rename</button></li>
      <li><button data-do="deleteGroup" data-arg="${id}">Delete Collection</button></li>
    </ul>
    <div id="out"><ol class="works">${works.map((m, i) => blurb(m, `<div class="gctl"><span class="muted">Order</span>
      <button data-do="moveInGroup" data-arg="${id},${m.id},-1" ${i ? '' : 'disabled'}>↑</button>
      <button data-do="moveInGroup" data-arg="${id},${m.id},1" ${i < works.length - 1 ? '' : 'disabled'}>↓</button>
      <button data-do="leaveGroup" data-arg="${id},${m.id}">Remove</button></div>`)).join('')}</ol></div>
    ${works.length ? '' : '<p class="center muted">This collection is empty. Open a work and choose this collection in "Collections…".</p>'}`;
}

function upNext(m) {
  const nx = nextOf(m), opt = (v, l) => `<option value="${v}" ${(m.next || '') === v ? 'selected' : ''}>${esc(l)}</option>`;
  return `<div class="upnext">
    ${nx ? `<a class="btn" href="#w/${nx.id}/${nx.last ?? 0}">Next in series: ${esc(nx.title)} →</a><br>` : ''}
    ${groups.map(g => [g, index.find(x => x.id === g.ids[g.ids.indexOf(m.id) + 1])]).filter(([g, n]) => g.ids.includes(m.id) && n)
      .map(([g, n]) => `<a class="btn" href="#w/${n.id}/${n.last ?? 0}">Next in ${esc(g.name)}: ${esc(n.title)} →</a><br>`).join('')}
    <select class="nextsel" data-id="${m.id}">${opt('', 'Next work: automatic (AO3 series)')}${opt('none', 'Next work: none')}
      ${index.filter(x => x !== m).map(x => opt(x.id, 'Next work: ' + x.title)).join('')}</select></div>`;
}

function showSettings() {
  document.title = 'Settings';
  main.innerHTML = `<h2 class="heading">Backup &amp; moving to another phone</h2>
    <p>The backup file is encrypted with your password, so it can't be read without it. Send it to yourself any way you like
       (cable, Drive, WhatsApp), then on the new phone open the app and choose "Restore from a backup file".</p>
    <p><button data-do="backup">Create a backup file</button></p>
    <p><button data-do="merge">Add works from a backup file to this library</button></p>
    <h2 class="heading">Text size</h2>
    ${[['ls', 'Works list &amp; bookshelf'], ['fs', 'Reading']].map(([k, l]) =>
      `<p>${l}: <button data-do="size" data-arg="${k},-1">A−</button> <b>${size(k)}</b> <button data-do="size" data-arg="${k},1">A+</button></p>`).join('')}
    <p class="muted">${index.length} works in your library · auto-locks after 5 minutes in the background</p>`;
}

applySizes();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
start();
</script>
</body>
</html>
